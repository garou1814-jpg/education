terintuitive = true but contrary to expectations.'],['Soderstrom and Bjork (2015) warn that short-term gains are:',['the best measure of real learning','impossible for a teacher to see','an unreliable guide to long-term learning','only found in young children'],2,'Short-term performance is not a reliable guide to long-term learning.'],['A schema is:',['a type of exam question','a group of connected ideas about one topic in the mind','a store that holds information for a few seconds','a method of teaching grammar'],1,'A schema is a connected structure of ideas.'],['Bartlett read Native American folk tales to his students. Later they:',['remembered every detail correctly','refused to retell the stories','remembered them better after one week','changed the stories to be more like their own culture'],3,'Participants changed details to fit their own cultural expectations.'],['Which activity is deep processing?',['copying a new word ten times','counting the letters in a word','writing a true sentence about your own life with the word','underlining a whole page of notes'],2,'Thinking about meaning and personal relevance is deep processing.'],['In Hyde and Jenkins (1973), the group that remembered the words better was asked to:',['say how much they liked each word','try hard to learn the words for a test','copy each word twice','count the letters in each word'],1,'Intentional learning produced better memory than shallow letter-counting.'],['The Yerkes-Dodson law says performance is best when arousal is:',['very low','medium','very high','zero'],1,'Performance is best at a medium level of arousal.']].forEach(x=>add(1,'A','mc',x[0],x[1],x[2],x[3]));

til:',['at least our early twenties','the age of 8','the age of 11','the first year of life'],0,'Development continues into at least the early twenties.'],['Steinberg (2007) found that adolescent decisions are strongly influenced by:',['the weather','the presence of peers','their height','the size of the school'],1,'Peers can strongly influence adolescent decisions.'],['Children exposed to constant traffic noise show:',['better concentration','no measurable difference','poorer reading comprehension','larger working memory'],2,'Traffic noise has been linked to poorer reading comprehension.'],['Ching (2017) found that maths anxiety harmed most:',['the youngest children only','boys more than girls','nobody — anxiety always helps','learners with better executive abilities'],3,'Maths anxiety especially harmed learners with better executive abilities.'],['A distraction is different from mind-wandering because a distraction:',['comes from outside the learner','comes from inside the learner','only happens in the morning','cannot be controlled at all'],0,'Distraction is external; mind-wandering is internal.'],['Risko et al. (2012) found that university students mind-wandered about:',['5 per cent of the time','15 per cent of the time','40 per cent of the time','90 per cent of the time'],2,'The chapter reports about 40%.'],['Ravizza et al. (2014) found that non-academic internet use during class:',['helped the high achievers only','made no difference to results','helped learners relax and focus','was negatively related to test performance for all learners'],3,'Non-academic internet use was negatively related to test performance.']].forEach(x=>add(2,'A','mc',x[0],x[1],x[2],x[3]));

ise a student’s self-esteem.',true],['Academic self-concept predicts future outcomes better than global self-esteem.',true],['Very young children usually rate their own ability very accurately.',false],['As children get older, their self-concepts of ability become less positive.',true]],4:[['Only people with a very high IQ can do creative work.',false],['Creativity usually means making something out of nothing.',false],['A new idea must also be useful before we call it creative.',true],['Teachers should aim for “big C” creativity in every lesson.',false],['Creative work is always a private, individual act.',false],['Great creative achievements usually rest on years of expertise.',true],['Rote learning can never help creative work in any way.',false],['Creative tasks help consolidate knowledge, because they need active retrieval.',true],['It is easier to draw an analogy when two situations are similar.',true],['A short break can help a learner solve a problem they were stuck on.',true]]};

const SC={1:[['Mr Hung explains the passive voice for 40 minutes with 35 slides. After 15 minutes his students stop writing and look tired. Which principle is he ignoring, and what should he change?','Attention is limited. He should reduce the load, vary activities and give students manageable chunks.'],['Lan reads her notes five times the night before the test. She feels very confident, but she gets a low score. Explain why, using two ideas from this chapter.','Re-reading can create short-term confidence without long-term learning. She should use retrieval practice and spacing instead.'],['A teacher teaches the present perfect in week 2 and never returns to it. In the May exam almost nobody can use it correctly. Name two principles involved and give one solution.','Spacing and retrieval practice are missing. Revisit the tense over time and make students retrieve it from memory.'],['Minh always studies at the same desk, in the same room, with the same music. In the exam hall he cannot remember anything. Which principle explains this, and what should he do?','Context can support retrieval. He should vary study conditions and practise retrieving in different contexts.'],['A teacher gives 20 present perfect gap-fills in a row. The class scores 19/20. The next week, the same students mix up the past simple and the present perfect. What should the teacher change, and why?','Use interleaving and retrieval rather than blocked repetition. Mixing related forms makes learning more demanding and discriminative.']],2:[['A teacher reads her slides aloud, word for word, while the students try to copy them into their notebooks. Which system is overloaded, and what should she do instead?','Working memory is overloaded. Reduce information, stop copying everything, and let students focus on key ideas.'],['A student writes “I have been in Hanoi since two years” every time, although you have corrected it five times. Why does the feedback not work, and what would?','Correction alone may not make the learner retrieve and process the correct form. Ask for active retrieval and meaningful use, then check again later.'],['A class of 7-year-olds must plan, write and check a three-paragraph story in one lesson. Name two reasons why this will fail, and give one solution.','Their working memory and executive function are still developing. Break the task into smaller stages and scaffold planning, writing and checking.'],['Your students say they “understand everything”, but then score 4/10 on the test. What is going wrong, and how could you check understanding better?','Familiarity can be mistaken for understanding. Use retrieval questions, application tasks and low-stakes testing.'],['A colleague adds cartoons, quotes and coloured borders to every worksheet “to make it attractive”. What would you say to her, using one term from this chapter?','Avoid unnecessary distraction. Attractive extras can consume limited attention without improving learning.']],3:[['A student tells you: “I am just not a language person.” Using academic self-concept, explain what has probably happened and say what you would do.','The student has developed a negative academic self-concept. Give specific evidence of progress and achievable subject goals rather than a global label.'],['Thu always revises the grammar she already knows well, and never the tense she finds confusing. Which goal orientation is this, and why does she do it?','This reflects avoiding difficulty/failure rather than pursuing learning. She protects her sense of competence by staying with easy work.'],['Your school gives a prize every month for “Top of the Class”. What effect does this have on goal orientation, and what would you suggest instead?','It can push students toward performance goals and comparison. Reward progress, mastery and effective strategies instead.'],['A teacher says to a girl who finished first: “You’re so clever!” Why may this harm her later, and what should the teacher have said?','A fixed ability label can make later failure feel threatening. Praise strategy, effort and effective learning choices instead.'],['A student who always scored well fails one test badly and then stops trying in your subject. Name the mindset involved and explain the thinking behind the behaviour.','A fixed mindset can interpret failure as proof of low ability. The student may then withdraw to protect self-worth.']],4:[['A colleague says: “Teaching grammar rules kills creativity in writing.” Using Principle 1, how would you answer?','Creativity needs factual and conceptual understanding. Grammar knowledge gives learners material they can use creatively.'],['Your students must write a short story in English next month. What must they prepare first, and how much lesson time would you give to it?','They need relevant language and conceptual knowledge first. Build expertise over time rather than expecting creativity without preparation.'],['You set a creative project on Monday and collect it on Friday of the same week. Which principle have you left out, and how would you redesign the timing?','Creative work needs time for incubation and development. Give a longer period with pauses and revisiting.'],['A teacher gives students a very detailed template with every paragraph planned. The results are correct but dull. Explain why, using a study from this chapter.','Too much structure can reduce the opportunity for association and originality. Creative work benefits from space to generate alternatives.'],['Your class produces only three ideas in a brainstorm and then stops. Using Deuja et al. (2014), what would you change?','Encourage more idea generation before judging ideas. Extend the brainstorming time and focus first on fluency.']]};
Object.entries(SC).forEach(([ch,arr])=>arr.forEach(x=>add(+ch,'C','scenario',x[0],null,x[1],x[1])));

let state=JSON.parse(localStorage.getItem('edupsych_v3')||'null')||{xp:0,streak:0,lastDay:null,mistakes:[],mastered:[],answers:{},completed:{},achievements:[]};
let page='home',mode=null,current=[],idx=0,submitted=false,selected=null,sessionCorrect=0;
const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem('edupsych_v3',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function play(file){const a=new Audio(file);a.volume=.75;a.play().catch(()=>{})}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}
function award(n){state.xp+=n;play('xp.mp3');toast(`+${n} XP ⚡`);save()}
function nav(p){page=p;render();scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function header(title,sub=''){return `<div class="hero"><span class="tag">MIDTERM REVISION</span><h1>${title}</h1><p>${sub}</p></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='';if(page==='home')h=home();if(page==='chapters')h=chapters();if(page==='review')h=review();if(page==='mistakes')h=mistakes();if(page==='achievements')h=achievements();$('app').innerHTML=h;bind()}
function home(){let done=Object.keys(state.completed).length,total=Q.length;return header('Learn it. Remember it. Master it.','Educational Psychology • Chapters 1–4. Built from your revision pages, with active recall and instant feedback.')+`<div class="stats"><div class="stat">⚡<b>${state.xp}</b><span class="muted">XP</span></div><div class="stat">🔥<b>${state.streak}</b><span class="muted">Day streak</span></div><div class="stat">🧠<b>${state.mistakes.length}</b><span class="muted">Mistakes</span></div><div class="stat">🏆<b>${done}/4</b><span class="muted">Chapters passed</span></div></div><div class="search"><input id="search" placeholder="Search a concept or question..."><div class="search-results" id="searchResults"></div></div><h2 class="section-title">Choose your next move</h2><div class="grid"><div class="card"><h2>📖 Learn</h2><p class="muted">Short memory blocks based on the chapter content.</p><button class="btn primary" data-go="chapters">Start learning</button></div><div class="card"><h2>🎯 Quick Practice</h2><p class="muted">Fast questions with green/red feedback and sound.</p><button class="btn primary" data-quick="1">Practice now</button></div><div class="card"><h2>🔁 Review mistakes</h2><p class="muted">Only practise what you got wrong.</p><button class="btn" data-page="mistakes">${state.mistakes.length?'Review '+state.mistakes.length+' mistakes':'No mistakes yet'}</button></div><div class="card"><h2>🏆 Progress</h2><p class="muted">Earn XP, build streaks and master chapters.</p><button class="btn" data-page="achievements">See achievements</button></div></div>`}
function chapters(){return header('Chapters','Learn the ideas first. Then test yourself.')+`<div class="grid">${Object.entries(CH).map(([n,c])=>`<div class="card chapter"><span class="tag">${c.emoji} CHAPTER ${n}</span><h2>${c.title}</h2><p class="muted">${c.memory.length} memory blocks • ${Q.filter(q=>q.ch==n).length} questions</p><div class="bar"><i style="width:${state.completed[n]?100:0}%"></i></div><div class="actions"><button class="btn primary" data-learn="${n}">📖 Learn</button><button class="btn" data-practice="${n}">🎯 Practice</button><button class="btn" data-flash="${n}">🃏 Recall</button></div></div>`).join('')}</div>`}
function learn(ch){let c=CH[ch];return header(`${c.emoji} Chapter ${ch}: ${c.title}`,'Read each small block. Then close the page and see what you can recall.')+c.memory.map((m,i)=>`<div class="learn-box ${i%2===1?'memory':''}"><span class="tag">MEMORY ${i+1}</span><h2>${m[0]}</h2><p><b>${m[1]}</b></p><p class="muted">${m[2]}</p></div>`).join('')+`<div class="card"><h2>🧠 Ready to retrieve?</h2><p class="muted">Do not look back. Try to explain the key ideas in your own words.</p><div class="actions"><button class="btn primary" data-practice="${ch}">🎯 Test me</button><button class="btn" data-flash="${ch}">🃏 Recall cards</button></div></div>`}
function start(ch,type){current=Q.filter(q=>q.ch==ch);if(type==='quick')current=current.filter(q=>q.sec==='A').slice(0,8);if(type==='retry')current=current.filter(q=>state.mistakes.includes(q.id));if(!current.length){toast('Nothing to review 🎉');return}mode=type;idx=0;submitted=false;selected=null;sessionCorrect=0;renderQuiz()}
function renderQuiz(){page='quiz';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let q=current[idx];let answered=state.answers[q.id];let total=current.length;let choice=q.type==='fill'?`<input class="fill" id="fill" placeholder="Type your answer..." value="${answered?.user||''}" ${answered?'disabled':''}>`:`<div class="options">${q.opts.map((o,i)=>{let cls='';if(submitted||answered){if(i===q.ans)cls='correct';if(i===answered?.index && i!==q.ans)cls='wrong'}else if(selected===i)cls='selected';return `<button class="option ${cls}" data-opt="${i}" ${submitted||answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`}).join('')}</div>`;let fb='';if(submitted||answered){let ok=answered?answered.correct:checkFill(q);fb=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ CORRECT!':'✗ WRONG!'}<br><small>${esc(q.exp)}</small></div>`}$('app').innerHTML=`<div class="quiz-wrap"><div class="quiz-head"><div><span class="tag">${mode==='retry'?'MISTAKE REVIEW':mode.toUpperCase()}</span><h2>${CH[q.ch].emoji} Chapter ${q.ch}</h2></div><button class="btn" id="exit">Exit</button></div><div class="card"><div class="muted">Question ${idx+1} / ${total} • Section ${q.sec}</div><div class="bar" style="margin-top:10px"><i style="width:${(idx+1)/total*100}%"></i></div><div class="qtext">${esc(q.q)}</div>${choice}${fb}<div class="actions">${submitted||answered?`<button class="btn primary" id="next">${idx===total-1?'Finish':'Next →'}</button>${!answered?`<button class="btn" id="retryOne">Try again</button>`:''}`:`<button class="btn primary" id="submitOne">Check answer ✓</button>`}</div></div><div class="card review"><h3>💡 Memory hint</h3><p class="muted">${hint(q)}</p></div></div>`;bindQuiz(q)}
function hint(q){if(q.ch===1)return 'Think: Encoding 📥 → Storage 🗄️ → Retrieval 📤. Easy practice is not always durable learning.';if(q.ch===2)return 'Attention is limited. Working memory is active. Executive function helps you plan, inhibit and monitor.';if(q.ch===3)return 'Self-esteem = global value; academic self-concept = belief about one school subject. Achievement and self-concept can affect each other.';return 'Creativity = NEW + USEFUL. Divergent = many answers; convergent = one answer; fluency = number of ideas.'}
function checkFill(q){let v=($('fill')?.value||'').trim().toLowerCase();return v===String(q.ans).toLowerCase()}
function submit(){let q=current[idx],ok=false,user=null;if(q.type==='fill'){user=($('fill')?.value||'').trim();ok=checkFill(q)}else{ok=selected===q.ans;user=selected}let rec={correct:ok,user:user,index:typeof user==='number'?user:null};state.answers[q.id]=rec;if(!ok&&!state.mistakes.includes(q.id))state.mistakes.push(q.id);if(ok){state.mistakes=state.mistakes.filter(x=>x!==q.id);state.mastered=Array.from(new Set([...state.mastered,q.id]));sessionCorrect++;play('right.mp3');award(10)}else play('wrong.mp3');state.completed[q.ch]=false;save();submitted=true;renderQuiz()}
function next(){if(idx<current.length-1){idx++;submitted=false;selected=null;renderQuiz()}else{if(sessionCorrect===current.length){state.completed[current[0].ch]=true;award(50);toast('Chapter mastered! 🏆')}save();renderResult()}}
function renderResult(){page='result';$('app').innerHTML=`${header('🎉 Round complete!',`${sessionCorrect}/${current.length} correct. ${sessionCorrect===current.length?'Perfect round!':'Review your mistakes and try again.'}`)}<div class="card" style="text-align:center"><div style="font-size:60px">${sessionCorrect===current.length?'🏆':'💪'}</div><h2>${sessionCorrect}/${current.length}</h2><p class="muted">${state.mistakes.length} total mistakes waiting for review.</p><div class="actions" style="justify-content:center"><button class="btn primary" data-practice="${current[0].ch}">Retry chapter</button><button class="btn" data-page="mistakes">Review mistakes</button><button class="btn" data-page="home">Home</button></div></div>`;bind()}
function review(){let ids=Q.filter(q=>!state.answers[q.id]).slice(0,0);return header('🃏 Recall & Review','Use active recall: try to answer before revealing the idea.')+`<div class="grid">${Object.entries(CH).map(([n,c])=>`<div class="card"><h2>${c.emoji} Chapter ${n}</h2><p class="muted">Flip through the key ideas from the book.</p><button class="btn primary" data-flash="${n}">Start recall</button></div>`).join('')}</div>`}
function flash(ch){let cards=CH[ch].memory;let i=0,back=false;function draw(){let m=cards[i];$('modalBody').innerHTML=`<span class="tag">RECALL ${i+1}/${cards.length}</span><div class="flash" id="flip">${back?`<div><div class="muted">ANSWER</div>${esc(m[1])}<br><small class="muted">${esc(m[2])}</small></div>`:`<div>${esc(m[0])}<br><small class="muted">Tap to reveal</small></div>`}</div><div class="actions"><button class="btn" id="dont">× Not yet</button><button class="btn primary" id="know">✓ I know it</button><button class="btn" id="close">Close</button></div>`;$('modal').classList.add('show');$('flip').onclick=()=>{back=true;draw()};$('know').onclick=()=>{award(5);nextCard()};$('dont').onclick=()=>{toast('We will review this again 🔁');nextCard()};$('close').onclick=()=>$('modal').classList.remove('show')}function nextCard(){i++;back=false;if(i>=cards.length){$('modalBody').innerHTML='<div class="empty"><div style="font-size:55px">🧠</div><h2>Recall complete!</h2><p class="muted">Now test yourself without looking.</p><button class="btn primary" id="done">Practice</button></div>';$('done').onclick=()=>{$('modal').classList.remove('show');start(ch,'practice')};return}draw()}draw()}
function mistakes(){let ms=Q.filter(q=>state.mistakes.includes(q.id));return header('🔴 Mistakes Bank','Your mistakes are not failures. They are your study list.')+(ms.length?`<div class="card"><h2>${ms.length} questions to revisit</h2><div class="actions"><button class="btn primary" data-retry="1">Retry all</button></div>${ms.map(q=>`<div class="review-row"><b>Ch ${q.ch}</b> • ${esc(q.q)}<br><small class="muted">Correct: ${q.type==='fill'?esc(q.ans):esc(q.opts[q.ans])}</small></div>`).join('')}</div>`:`<div class="card empty"><div style="font-size:55px">🎉</div><h2>No mistakes!</h2><p class="muted">Keep practising and this bank stays empty.</p></div>`)}
function achievements(){let a=[['🔥','First Steps','Complete a practice question',Q.some(q=>state.answers[q.id])],['⚡','XP Hunter','Earn 100 XP',state.xp>=100],['🧠','Memory Builder','Master 10 questions',state.mastered.length>=10],['🏆','Chapter Master','Get a perfect round',Object.keys(state.completed).length>0],['🔥','Streak 3','Study on 3 days',state.streak>=3]];return header('🏆 Achievements','Small wins make revision feel like a game.')+`<div class="grid">${a.map(x=>`<div class="card achievement" style="opacity:${x[3]?1:.45}"><div class="emoji">${x[0]}</div><div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div></div>`).join('')}</div>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{page='learn';$('app').innerHTML=learn(+b.dataset.learn);bind()});document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>start(+b.dataset.practice,'practice'));document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>start(1,'quick'));document.querySelectorAll('[data-flash]').forEach(b=>b.onclick=()=>flash(+b.dataset.flash));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{current=Q.filter(q=>state.mistakes.includes(q.id));if(current.length){mode='retry';idx=0;submitted=false;selected=null;sessionCorrect=0;renderQuiz()}});let s=$('search');if(s){s.oninput=()=>{let term=s.value.toLowerCase().trim(),box=$('searchResults');if(!term){box.style.display='none';return}let r=Q.filter(q=>q.q.toLowerCase().includes(term)||q.exp.toLowerCase().includes(term)).slice(0,8);box.innerHTML=r.map(q=>`<div class="search-item" data-sid="${q.id}"><b>Ch ${q.ch} • ${q.sec}</b><br>${esc(q.q)}</div>`).join('');box.style.display=r.length?'block':'none';box.querySelectorAll('[data-sid]').forEach(x=>x.onclick=()=>{let q=Q.find(z=>z.id==x.dataset.sid);current=[q];mode='search';idx=0;submitted=false;selected=null;box.style.display='none';renderQuiz()})}}}
function bindQuiz(q){$('exit').onclick=()=>nav('home');document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{selected=+b.dataset.opt;renderQuiz()});$('submitOne').onclick=submit;if($('next'))$('next').onclick=next;if($('retryOne'))$('retryOne').onclick=()=>{delete state.answers[q.id];save();submitted=false;selected=null;renderQuiz()}}
function boot(){let last=localStorage.getItem('edupsych_last');if(last!==today()){if(last){let d=new Date(last),n=new Date();let diff=Math.floor((n-d)/86400000);state.streak=diff===1?state.streak+1:1}else state.streak=1;state.lastDay=today();localStorage.setItem('edupsych_last',today());save()}render()}
boot();
</script>
</body></html>
